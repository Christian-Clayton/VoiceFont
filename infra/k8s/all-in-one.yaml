---
apiVersion: v1
kind: Namespace
metadata:
  name: voicefont
---
# Storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: voicefont-models
  namespace: voicefont
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
# Weaviate (CPU)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weaviate
  namespace: voicefont
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weaviate
  template:
    metadata:
      labels:
        app: weaviate
    spec:
      containers:
        - name: weaviate
          image: semitechnologies/weaviate:1.26.4
          ports:
            - containerPort: 8080
          env:
            - name: QUERY_DEFAULTS_LIMIT
              value: "25"
            - name: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED
              value: "true"
            - name: PERSISTENCE_DATA_PATH
              value: "/var/lib/weaviate"
            - name: DEFAULT_VECTORIZER_MODULE
              value: "none"
            - name: ENABLE_MODULES
              value: ""
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: "500m"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: weaviate
  namespace: voicefont
spec:
  selector:
    app: weaviate
  ports:
    - port: 18080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
# Triton (GPU)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  namespace: voicefont
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triton
  template:
    metadata:
      labels:
        app: triton
    spec:
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:24.05-py3
          command: ["/bin/sh", "-c"]
          args: ["tritonserver --model-repository=/models --http-port=8000 --grpc-port=8001 --metrics-port=8002 --model-control-mode=explicit"]
          ports:
            - containerPort: 8000
            - containerPort: 8001
            - containerPort: 8002
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            limits:
              nvidia.com/gpu: "1"  # Request GPU
              memory: "4Gi"
              cpu: "2"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: voicefont-models
      # Node affinity for GPU nodes
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: Exists
---
apiVersion: v1
kind: Service
metadata:
  name: triton
  namespace: voicefont
spec:
  selector:
    app: triton
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
# VoiceFont (FastAPI)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voicefont
  namespace: voicefont
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voicefont
  template:
    metadata:
      labels:
        app: voicefont
    spec:
      containers:
        - name: voicefont
          image: voicefont-app:latest
          ports:
            - containerPort: 8000
          env:
            - name: VOICEFONT_WS_URL
              value: "http://weaviate:18080"
            - name: VOICEFONT_TRITON_URL
              value: "http://triton:8000"
            - name: VOICEFONT_EMBEDDINGS
              value: "/app/data/embeddings"
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: voicefont
  namespace: voicefont
spec:
  selector:
    app: voicefont
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voicefont
  namespace: voicefont
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: voicefont
                port:
                  number: 8000
    - http:
        paths:
          - path: /triton
            pathType: Prefix
            backend:
              service:
                name: triton
                port:
                  number: 8000
    - http:
        paths:
          - path: /weaviate
            pathType: Prefix
            backend:
              service:
                name: weaviate
                port:
                  number: 18080
