[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "voicefont"
version = "0.1.0"
description = "Local consent-aware acoustic profile registry"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26", "scipy>=1.12", "fastapi>=0.115", "uvicorn>=0.30", "typer>=0.12", "httpx>=0.27", "pydantic>=2.8"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.9.1,<2", "langgraph>=1.2.11,<2", "mlflow>=3.16.1,<4", "torch>=2.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "build>=1.2", "playwright>=1.49"]

[project.scripts]
voicefont = "voicefont.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/voicefont"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "voicefont/web"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402", "E501"]

